      <text x="175" y="348" font-family="Arial, sans-serif" font-size="16" fill="#2C3E50" font-weight="bold">实现轻量级形式化验证</text>
      <text x="175" y="373" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">O(V+E) 复杂度，Rust FFI 零拷贝调用</text>
    </g>
    
