    <text x="320" y="67" font-family="Arial, sans-serif" font-size="18" fill="#7F8C8D">Conclusion &amp; Future Work</text>
    <line x1="60" y1="90" x2="1220" y2="90" stroke="#D5D8DC" stroke-width="1" />
  </g>
