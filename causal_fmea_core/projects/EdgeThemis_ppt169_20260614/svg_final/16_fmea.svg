        <path fill="#E8B931" fill-opacity="0.1" d="M148,0 H252 A8,8 0 0 1 260,8 V42 A8,8 0 0 1 252,50 H148 A8,8 0 0 1 140,42 V8 A8,8 0 0 1 148,0 Z" />
