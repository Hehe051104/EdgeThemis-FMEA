<line x1="120" y1="14" x2="180" y2="14" stroke="#D5D8DC" stroke-width="1.5" />
<line x1="200" y1="14" x2="265" y2="14" stroke="#D5D8DC" stroke-width="1.5" />
<line x1="285" y1="14" x2="355" y2="14" stroke="#D5D8DC" stroke-width="1.5" />
<line x1="375" y1="14" x2="440" y2="14" stroke="#D5D8DC" stroke-width="1.5" />
<line x1="460" y1="14" x2="520" y2="14" stroke="#D5D8DC" stroke-width="1.5" />
<line x1="540" y1="14" x2="595" y2="14" stroke="#D5D8DC" stroke-width="1.5" />
<path fill="#FFF" stroke="#D5D8DC" stroke-width="0.5" d="M634,5 H686 A4,4 0 0 1 690,9 V31 A4,4 0 0 1 686,35 H634 A4,4 0 0 1 630,31 V9 A4,4 0 0 1 634,5 Z" />
<circle cx="640" cy="14" r="3" fill="#E8B931" /><text x="648" y="17" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">Python</text>
<circle cx="640" cy="26" r="3" fill="#2E86DE" /><text x="648" y="29" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">Rust</text>
</g>



  
  <g id="p07-cycle" transform="translate(0, 10)">
    
    <circle cx="350" cy="380" r="170" fill="none" stroke="#E8E8E8" stroke-width="1.5" stroke-dasharray="6,4" />
    <circle cx="350" cy="380" r="110" fill="none" stroke="#E8E8E8" stroke-width="1" stroke-dasharray="4,4" />
    
    <text x="350" y="370" text-anchor="middle" font-family="Georgia, SimHei, serif" font-size="20" font-weight="bold" fill="#1A3C6E">Reflection</text>
    <text x="350" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">最多 5 轮熔断</text>
    
    
    <path d="M 410,230 Q 500,250 510,340" stroke="#2E86DE" stroke-width="2.5" fill="none" stroke-opacity="0.5" />
    <polygon points="515,342 508,334 512,348" fill="#2E86DE" fill-opacity="0.6" />
    
    <path d="M 510,400 Q 520,490 430,530" stroke="#E74C3C" stroke-width="2.5" fill="none" stroke-opacity="0.5" />
