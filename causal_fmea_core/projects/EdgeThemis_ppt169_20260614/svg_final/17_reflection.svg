<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" />
      <feOffset dx="0" dy="3" result="offsetblur" />
      <feFlood flood-color="#000000" flood-opacity="0.12" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow" />
      <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" />
      <feOffset dx="0" dy="2" result="offsetblur" />
      <feFlood flood-color="#000000" flood-opacity="0.06" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow" />
      <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  
  <rect width="1280" height="720" fill="#FFFFFF" />
  
  <g id="p07-header">
    <path fill="#1A3C6E" d="M62,40 H63 A2,2 0 0 1 65,42 V74 A2,2 0 0 1 63,76 H62 A2,2 0 0 1 60,74 V42 A2,2 0 0 1 62,40 Z" />
    <text x="78" y="67" font-family="Georgia, SimHei, serif" font-size="34" font-weight="bold" fill="#1A3C6E">自反思纠错闭环</text>
    <text x="430" y="67" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">：LLM 自动修正因果图的迭代流程</text>
    <text x="78" y="90" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D" letter-spacing="0.5">Self-Reflection Loop: Automated Iterative Correction</text>
    <line x1="60" y1="104" x2="1220" y2="104" stroke="#D5D8DC" stroke-width="1" />
  </g>
<g id="stage-indicator" transform="translate(590, 14)">
