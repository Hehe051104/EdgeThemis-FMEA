      <text x="760" y="164" font-family="Arial, sans-serif" font-size="15" fill="#2C3E50" font-weight="bold">LLM 提取 → Rust 检测到环路</text>
      <text fill="#2C3E50" font-size="14" font-family="Arial, sans-serif" x="660" y="195">提取结果：A→B→C→A（含循环）</text><text fill="#2C3E50" font-size="14" font-family="Arial, sans-serif" x="660" y="220"><tspan>Rust Kahn 检测：发现<tspan fill="#E74C3C" font-weight="bold">环路</tspan>，违反 DAG 约束</tspan>
      </text><text x="660" y="248" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">→ 拦截报告反馈 LLM 生成器</text>
    </g>
    
    <g id="round-2" filter="url(#cardShadow)">
      <path fill="#FFFFFF" d="M650,290 H1210 A10,10 0 0 1 1220,300 V420 A10,10 0 0 1 1210,430 H650 A10,10 0 0 1 640,420 V300 A10,10 0 0 1 650,290 Z" />
      <path fill="#E8B931" d="M643,290 H643 A3,3 0 0 1 646,293 V427 A3,3 0 0 1 643,430 H643 A3,3 0 0 1 640,427 V293 A3,3 0 0 1 643,290 Z" />
      <path fill="#E8B931" d="M674,305 H726 A14,14 0 0 1 740,319 V319 A14,14 0 0 1 726,333 H674 A14,14 0 0 1 660,319 V319 A14,14 0 0 1 674,305 Z" />
      <text x="700" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">Round 2</text>
      <text x="760" y="324" font-family="Arial, sans-serif" font-size="15" fill="#2C3E50" font-weight="bold">LLM 修正 → 环路消除，但 d-分离违反</text>
      <text fill="#2C3E50" font-size="14" font-family="Arial, sans-serif" x="660" y="355">环路已消除，DAG 合法性通过</text><text fill="#2C3E50" font-size="14" font-family="Arial, sans-serif" x="660" y="380"><tspan>Bayesian Ball 检测：X 和 Y 应<tspan fill="#E8B931" font-weight="bold">条件独立</tspan>但存在活跃路径</tspan>
      </text><text x="660" y="408" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">→ 拦截报告再次反馈 LLM</text>
    </g>
    
    <g id="round-3" filter="url(#cardShadow)">
      <path fill="#FFFFFF" d="M650,450 H1210 A10,10 0 0 1 1220,460 V580 A10,10 0 0 1 1210,590 H650 A10,10 0 0 1 640,580 V460 A10,10 0 0 1 650,450 Z" />
      <path fill="#27AE60" d="M643,450 H643 A3,3 0 0 1 646,453 V587 A3,3 0 0 1 643,590 H643 A3,3 0 0 1 640,587 V453 A3,3 0 0 1 643,450 Z" />
      <path fill="#27AE60" d="M674,465 H726 A14,14 0 0 1 740,479 V479 A14,14 0 0 1 726,493 H674 A14,14 0 0 1 660,479 V479 A14,14 0 0 1 674,465 Z" />
      <text x="700" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">Round 3</text>
      <text x="760" y="484" font-family="Arial, sans-serif" font-size="15" fill="#2C3E50" font-weight="bold">LLM 再次修正 → 全部验证通过</text>
      <text fill="#2C3E50" font-size="14" font-family="Arial, sans-serif" x="660" y="515"><tspan>DAG 合法性：<tspan fill="#27AE60" font-weight="bold">✓ 无环路</tspan></tspan>
      </text><text fill="#2C3E50" font-size="14" font-family="Arial, sans-serif" x="660" y="540"><tspan>d-分离一致性：<tspan fill="#27AE60" font-weight="bold">✓ 条件独立关系正确</tspan></tspan>
      </text><text fill="#2C3E50" font-size="14" font-family="Arial, sans-serif" x="660" y="568"><tspan>FMEA RPN：<tspan fill="#27AE60" font-weight="bold">✓ 风险标注完成</tspan></tspan>
      </text></g>
  </g>
  
  <g id="p07-fuse">
    <path fill="#1A3C6E" fill-opacity="0.08" d="M68,630 H552 A8,8 0 0 1 560,638 V662 A8,8 0 0 1 552,670 H68 A8,8 0 0 1 60,662 V638 A8,8 0 0 1 68,630 Z" />
    
