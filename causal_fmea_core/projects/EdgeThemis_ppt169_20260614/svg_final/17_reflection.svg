<text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">FMEA RPN</text>
<circle cx="530" cy="14" r="10" fill="#E8B931" />
<text x="530" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#E8B931" font-weight="bold">Reflector</text>
