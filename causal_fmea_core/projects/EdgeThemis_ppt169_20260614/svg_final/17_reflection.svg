      <text x="230" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">04</text>
      <text x="230" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.85">Retry</text>
    </g>
  </g>
  
  <g id="p07-rounds">
    
    <g id="round-1" filter="url(#cardShadow)">
      <path fill="#FFFFFF" d="M650,130 H1210 A10,10 0 0 1 1220,140 V260 A10,10 0 0 1 1210,270 H650 A10,10 0 0 1 640,260 V140 A10,10 0 0 1 650,130 Z" />
      <path fill="#E74C3C" d="M643,130 H643 A3,3 0 0 1 646,133 V267 A3,3 0 0 1 643,270 H643 A3,3 0 0 1 640,267 V133 A3,3 0 0 1 643,130 Z" />
