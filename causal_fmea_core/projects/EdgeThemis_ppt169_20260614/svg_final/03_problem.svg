  <g id="p02-context">
    <text fill="#2C3E50" font-size="20" font-family="Arial, sans-serif" x="60" y="150"><tspan>因果推理在<tspan font-weight="bold" fill="#1A3C6E">医疗诊断</tspan>、<tspan font-weight="bold" fill="#1A3C6E">工业故障分析</tspan>、</tspan>
      </text><text fill="#2C3E50" font-size="20" font-family="Arial, sans-serif" x="60" y="182"><tspan><tspan font-weight="bold" fill="#1A3C6E">政策评估</tspan>等领域至关重要。LLM 虽能从</tspan>
      </text><text fill="#2C3E50" font-size="20" font-family="Arial, sans-serif" x="60" y="214"><tspan>文本中提取因果关系，但输出<tspan font-weight="bold" fill="#E74C3C">缺乏可验证性</tspan>，</tspan>
      </text><text fill="#2C3E50" font-size="20" font-family="Arial, sans-serif" x="60" y="246">无法保证逻辑一致性。</text><path fill="#D5D8DC" d="M62,290 H498 A2,2 0 0 1 500,292 V292 A2,2 0 0 1 498,294 H62 A2,2 0 0 1 60,292 V292 A2,2 0 0 1 62,290 Z" />
