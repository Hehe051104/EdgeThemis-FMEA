    <text x="700" y="448" font-family="Consolas, monospace" font-size="12" fill="#7F8C8D">// Rust 核心：方向状态 BFS</text>
    <text x="700" y="468" font-family="Consolas, monospace" font-size="12" fill="#2C3E50">queue.push_back((x, <tspan fill="#2E86DE" font-weight="bold">false</tspan>)); <tspan fill="#7F8C8D">// Up</tspan></text>
    <text x="700" y="486" font-family="Consolas, monospace" font-size="12" fill="#2C3E50"><tspan fill="#E74C3C" font-weight="bold">if</tspan> curr == y { <tspan fill="#E74C3C" font-weight="bold">return false</tspan>; }</text>
    <text x="700" y="504" font-family="Consolas, monospace" font-size="12" fill="#2C3E50"><tspan fill="#27AE60" font-weight="bold">if</tspan> !is_down &amp;&amp; !observed[curr] {</text>
    <text x="712" y="518" font-family="Consolas, monospace" font-size="11" fill="#7F8C8D">explore_children(); explore_parents();</text>
  </g>
  
