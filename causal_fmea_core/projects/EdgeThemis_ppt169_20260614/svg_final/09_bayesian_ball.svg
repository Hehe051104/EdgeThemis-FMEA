    <text x="80" y="455" font-family="Georgia, SimHei, serif" font-size="15" fill="#E8B931" font-weight="bold">关键理解</text>
    <text x="80" y="478" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">• "允许"≠ 大模型做对了，而是让侦探能<tspan font-weight="bold" fill="#E74C3C">探测到漏洞</tspan></text>
    <text x="80" y="498" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">• 球到 Y = 发现通路 → 上层判断是否报警</text>
    <text x="80" y="518" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">• 球卡死 = 路径安全 → 无需干预</text>
  </g>
  
  <g id="code">
