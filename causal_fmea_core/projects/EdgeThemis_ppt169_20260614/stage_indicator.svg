<!--
  Stage Indicator Template — 550x40px
  Place at top-right of each page: transform="translate(670, 18)"

  Active stage: fill="#1A3C6E" (deep navy), bold text
  Inactive stages: fill="#D5D8DC" (light gray), normal text

  Stages: Input → Generator → Cycle → d-Sep → FMEA → Reflector → Output
  Languages: Python (orange bar) | Rust (blue bar)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 40" width="550" height="40">
  <!-- Background -->
  <rect x="0" y="0" width="550" height="40" rx="6" fill="#F5F7FA" stroke="#D5D8DC" stroke-width="1"/>

  <!-- Stage dots and labels — ACTIVE version (use for current stage) -->
  <!-- Example: d-Sep is active -->

  <!-- Input -->
  <circle cx="30" cy="14" r="6" fill="#D5D8DC"/>
  <text x="30" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7F8C8D">Input</text>

  <!-- Generator (Python) -->
  <circle cx="95" cy="14" r="6" fill="#D5D8DC"/>
  <text x="95" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7F8C8D">Generator</text>
  <rect x="78" y="1" width="34" height="5" rx="2" fill="#E8B931" fill-opacity="0.3"/>
  <text x="95" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#E8B931">Python</text>

  <!-- Cycle (Rust) -->
  <circle cx="165" cy="14" r="6" fill="#D5D8DC"/>
  <text x="165" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7F8C8D">Cycle</text>
  <rect x="152" y="1" width="26" height="5" rx="2" fill="#2E86DE" fill-opacity="0.3"/>
  <text x="165" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#2E86DE">Rust</text>

  <!-- d-Sep (Rust) — ACTIVE -->
  <circle cx="235" cy="14" r="8" fill="#1A3C6E"/>
  <text x="235" y="18" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#FFFFFF" font-weight="bold">d</text>
  <text x="235" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#1A3C6E" font-weight="bold">d-Sep</text>
  <rect x="218" y="1" width="34" height="5" rx="2" fill="#2E86DE" fill-opacity="0.6"/>
  <text x="235" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#2E86DE" font-weight="bold">Rust</text>

  <!-- FMEA (Rust) -->
  <circle cx="305" cy="14" r="6" fill="#D5D8DC"/>
  <text x="305" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7F8C8D">FMEA</text>
  <rect x="292" y="1" width="26" height="5" rx="2" fill="#2E86DE" fill-opacity="0.3"/>
  <text x="305" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#2E86DE">Rust</text>

  <!-- Reflector (Python) -->
  <circle cx="375" cy="14" r="6" fill="#D5D8DC"/>
  <text x="375" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7F8C8D">Reflector</text>
  <rect x="355" y="1" width="40" height="5" rx="2" fill="#E8B931" fill-opacity="0.3"/>
  <text x="375" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="5" fill="#E8B931">Python</text>

  <!-- Output -->
  <circle cx="445" cy="14" r="6" fill="#D5D8DC"/>
  <text x="445" y="34" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7F8C8D">Output</text>

  <!-- Connecting lines -->
  <line x1="36" y1="14" x2="89" y2="14" stroke="#D5D8DC" stroke-width="1.5"/>
  <line x1="101" y1="14" x2="159" y2="14" stroke="#D5D8DC" stroke-width="1.5"/>
  <line x1="171" y1="14" x2="227" y2="14" stroke="#1A3C6E" stroke-width="2"/>
  <line x1="243" y1="14" x2="299" y2="14" stroke="#D5D8DC" stroke-width="1.5"/>
  <line x1="311" y1="14" x2="369" y2="14" stroke="#D5D8DC" stroke-width="1.5"/>
  <line x1="381" y1="14" x2="439" y2="14" stroke="#D5D8DC" stroke-width="1.5"/>

  <!-- Language legend -->
  <rect x="470" y="5" width="70" height="28" rx="4" fill="#FFFFFF" stroke="#D5D8DC" stroke-width="0.5"/>
  <circle cx="482" cy="14" r="3" fill="#E8B931"/>
  <text x="490" y="17" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">Python</text>
  <circle cx="482" cy="25" r="3" fill="#2E86DE"/>
  <text x="490" y="28" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">Rust</text>
</svg>
