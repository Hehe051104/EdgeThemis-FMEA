<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Header -->
  <g id="p08-header">
    <rect x="60" y="40" width="5" height="36" rx="2" fill="#1A3C6E"/>
    <text x="78" y="67" font-family="Georgia, SimHei, serif" font-size="36" font-weight="bold" fill="#1A3C6E">实验配置</text>
    <text x="310" y="67" font-family="Arial, sans-serif" font-size="18" fill="#7F8C8D">：Qwen 2.5-3B + 三组消融对比</text>
    <text x="78" y="92" font-family="Arial, sans-serif" font-size="15" fill="#7F8C8D" letter-spacing="0.5">Experimental Setup</text>
    <line x1="60" y1="108" x2="1220" y2="108" stroke="#D5D8DC" stroke-width="1"/>
  </g>
<g id="stage-indicator" transform="translate(590, 14)">
<rect x="0" y="0" width="640" height="42" rx="6" fill="#F5F7FA" stroke="#D5D8DC" stroke-width="1"/>
<circle cx="30" cy="14" r="6" fill="#D5D8DC"/>
<text x="30" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">Input</text>
<circle cx="110" cy="14" r="6" fill="#D5D8DC"/>
<text x="110" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">Generator</text>
<circle cx="190" cy="14" r="6" fill="#D5D8DC"/>
<text x="190" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">Interning</text>
<circle cx="275" cy="14" r="6" fill="#D5D8DC"/>
<text x="275" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">Kahn Cycle</text>
<circle cx="365" cy="14" r="6" fill="#D5D8DC"/>
<text x="365" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">d-Separation</text>
<circle cx="450" cy="14" r="6" fill="#D5D8DC"/>
<text x="450" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">FMEA RPN</text>
<circle cx="530" cy="14" r="6" fill="#D5D8DC"/>
<text x="530" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">Reflector</text>
<circle cx="605" cy="14" r="10" fill="#27AE60"/>
<text x="605" y="38" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27AE60" font-weight="bold">Output</text>
<line x1="40" y1="14" x2="100" y2="14" stroke="#D5D8DC" stroke-width="1.5"/>
<line x1="120" y1="14" x2="180" y2="14" stroke="#D5D8DC" stroke-width="1.5"/>
<line x1="200" y1="14" x2="265" y2="14" stroke="#D5D8DC" stroke-width="1.5"/>
<line x1="285" y1="14" x2="355" y2="14" stroke="#D5D8DC" stroke-width="1.5"/>
<line x1="375" y1="14" x2="440" y2="14" stroke="#D5D8DC" stroke-width="1.5"/>
<line x1="460" y1="14" x2="520" y2="14" stroke="#D5D8DC" stroke-width="1.5"/>
<line x1="540" y1="14" x2="595" y2="14" stroke="#D5D8DC" stroke-width="1.5"/>
<rect x="630" y="5" width="60" height="30" rx="4" fill="#FFF" stroke="#D5D8DC" stroke-width="0.5"/>
<circle cx="640" cy="14" r="3" fill="#E8B931"/><text x="648" y="17" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">Python</text>
<circle cx="640" cy="26" r="3" fill="#2E86DE"/><text x="648" y="29" font-family="Arial, sans-serif" font-size="7" fill="#7F8C8D">Rust</text>
</g>



  <!-- Main table -->
  <g id="p08-table">
    <!-- Row: LLM -->
    <g id="row-llm">
      <rect x="60" y="130" width="280" height="65" rx="8" fill="#1A3C6E" fill-opacity="0.08"/>
      <text x="200" y="168" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1A3C6E" font-weight="bold">LLM 模型</text>
      <rect x="360" y="130" width="860" height="65" rx="8" fill="#F5F7FA" stroke="#D5D8DC" stroke-width="1"/>
      <text x="790" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#2C3E50" font-weight="bold">Qwen 2.5-3B</text>
      <text x="790" y="182" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">Q4 量化 · 本地部署</text>
    </g>
    <!-- Row: Inference -->
    <g id="row-inference">
      <rect x="60" y="205" width="280" height="65" rx="8" fill="#1A3C6E" fill-opacity="0.08"/>
      <text x="200" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1A3C6E" font-weight="bold">推理框架</text>
      <rect x="360" y="205" width="860" height="65" rx="8" fill="#FFFFFF" stroke="#D5D8DC" stroke-width="1"/>
      <text x="790" y="235" text-anchor="middle" font-family="Consolas, monospace" font-size="18" fill="#2C3E50" font-weight="bold">llama-server</text>
      <text x="790" y="257" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">OpenAI-compatible API · localhost:8080</text>
    </g>
    <!-- Row: Context -->
    <g id="row-context">
      <rect x="60" y="280" width="280" height="65" rx="8" fill="#1A3C6E" fill-opacity="0.08"/>
      <text x="200" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1A3C6E" font-weight="bold">上下文窗口</text>
      <rect x="360" y="280" width="860" height="65" rx="8" fill="#F5F7FA" stroke="#D5D8DC" stroke-width="1"/>
      <text x="790" y="318" text-anchor="middle" font-family="Consolas, monospace" font-size="20" fill="#2C3E50" font-weight="bold">4096 tokens</text>
    </g>
    <!-- Row: JSON Constraint -->
    <g id="row-json">
      <rect x="60" y="355" width="280" height="65" rx="8" fill="#1A3C6E" fill-opacity="0.08"/>
      <text x="200" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1A3C6E" font-weight="bold">JSON 约束</text>
      <rect x="360" y="355" width="860" height="65" rx="8" fill="#FFFFFF" stroke="#D5D8DC" stroke-width="1"/>
      <text x="790" y="385" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#2C3E50" font-weight="bold">Pydantic schema → json_schema response format</text>
      <text x="790" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">强制 LLM 输出符合 CausalEdge / ExtractedGraph 结构</text>
    </g>
    <!-- Row: Test Scenarios -->
    <g id="row-scenarios">
      <rect x="60" y="430" width="280" height="65" rx="8" fill="#1A3C6E" fill-opacity="0.08"/>
      <text x="200" y="468" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1A3C6E" font-weight="bold">测试场景</text>
      <rect x="360" y="430" width="860" height="65" rx="8" fill="#F5F7FA" stroke="#D5D8DC" stroke-width="1"/>
      <text x="790" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#2C3E50" font-weight="bold">医院感染链路 · 工业故障传播</text>
      <text x="790" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">真实领域场景，含复杂因果关系和多层依赖</text>
    </g>
    <!-- Row: Ablation Configs -->
    <g id="row-configs">
      <rect x="60" y="510" width="280" height="120" rx="8" fill="#1A3C6E" fill-opacity="0.08"/>
      <text x="200" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#1A3C6E" font-weight="bold">对比配置</text>
      <rect x="360" y="510" width="270" height="120" rx="8" fill="#E74C3C" fill-opacity="0.08" stroke="#E74C3C" stroke-width="1.5"/>
      <text x="495" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#E74C3C" font-weight="bold">Config A</text>
      <text x="495" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">纯 LLM</text>
      <text x="495" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">无验证 · 无 FMEA</text>
      <rect x="650" y="510" width="270" height="120" rx="8" fill="#E8B931" fill-opacity="0.08" stroke="#E8B931" stroke-width="1.5"/>
      <text x="785" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#E8B931" font-weight="bold">Config B</text>
      <text x="785" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">+ Schema + Rust 验证</text>
      <text x="785" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">环路检测 + d-分离 + FMEA</text>
      <rect x="940" y="510" width="280" height="120" rx="8" fill="#27AE60" fill-opacity="0.08" stroke="#27AE60" stroke-width="1.5"/>
      <text x="1080" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#27AE60" font-weight="bold">Config C</text>
      <text x="1080" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">+ Reflection 闭环</text>
      <text x="1080" y="592" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">完整 EdgeThemis</text>
    </g>
  </g>
  <!-- Footer -->
  <g id="p08-footer">
    <text x="60" y="695" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">10</text>
    <text x="1220" y="695" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">EdgeThemis</text>
  </g>
</svg>
