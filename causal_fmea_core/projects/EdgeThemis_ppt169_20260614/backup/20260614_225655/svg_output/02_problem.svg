<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Header -->
  <g id="p02-header">
    <rect x="60" y="40" width="5" height="36" rx="2" fill="#1A3C6E"/>
    <text x="78" y="67" font-family="Georgia, SimHei, serif" font-size="36" font-weight="bold" fill="#1A3C6E">LLM 因果推理缺乏形式化保障</text>
    <text x="78" y="92" font-family="Arial, sans-serif" font-size="15" fill="#7F8C8D" letter-spacing="0.5">LLM Causal Reasoning Lacks Formal Guarantees</text>
    <line x1="60" y1="108" x2="1220" y2="108" stroke="#D5D8DC" stroke-width="1"/>
  </g>
  <!-- Left: Context paragraph -->
  <g id="p02-context">
    <text x="60" y="150" font-family="Arial, sans-serif" font-size="20" fill="#2C3E50">
      <tspan x="60" dy="0">因果推理在<tspan font-weight="bold" fill="#1A3C6E">医疗诊断</tspan>、<tspan font-weight="bold" fill="#1A3C6E">工业故障分析</tspan>、</tspan>
      <tspan x="60" dy="32"><tspan font-weight="bold" fill="#1A3C6E">政策评估</tspan>等领域至关重要。LLM 虽能从</tspan>
      <tspan x="60" dy="32">文本中提取因果关系，但输出<tspan font-weight="bold" fill="#E74C3C">缺乏可验证性</tspan>，</tspan>
      <tspan x="60" dy="32">无法保证逻辑一致性。</tspan>
    </text>
    <!-- Gap arrow -->
    <rect x="60" y="290" width="440" height="4" rx="2" fill="#D5D8DC"/>
    <text x="280" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D" font-style="italic">现有方法缺少对 LLM 因果推理输出的形式化验证闭环</text>
    <!-- Mini DAG illustration (broken) -->
    <g id="p02-broken-dag" transform="translate(100, 380)">
      <circle cx="0" cy="0" r="20" fill="none" stroke="#E74C3C" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="0" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">A</text>
      <line x1="20" y1="-10" x2="60" y2="-30" stroke="#E74C3C" stroke-width="2"/>
      <polygon points="60,-30 53,-24 56,-32" fill="#E74C3C"/>
      <circle cx="80" cy="-30" r="20" fill="none" stroke="#E74C3C" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="80" y="-25" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">B</text>
      <line x1="100" y1="-20" x2="140" y2="0" stroke="#E74C3C" stroke-width="2"/>
      <polygon points="140,0 134,-5 137,7" fill="#E74C3C"/>
      <circle cx="160" cy="0" r="20" fill="none" stroke="#E74C3C" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="160" y="5" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">C</text>
      <!-- Cycle back: C→A -->
      <path d="M 140,15 Q 80,50 20,15" fill="none" stroke="#E74C3C" stroke-width="2.5" stroke-dasharray="6,3"/>
      <polygon points="22,14 16,20 26,20" fill="#E74C3C"/>
      <text x="80" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">环路!</text>
    </g>
  </g>
  <!-- Right: Three pain-point cards -->
  <g id="p02-painpoints">
    <!-- Card 1: 因果幻觉 -->
    <g id="pain-1" filter="url(#cardShadow)">
      <rect x="560" y="130" width="660" height="140" rx="10" fill="#FFFFFF"/>
      <rect x="560" y="130" width="6" height="140" rx="3" fill="#E74C3C"/>
      <circle cx="610" cy="175" r="24" fill="#E74C3C" fill-opacity="0.1"/>
      <use data-icon="tabler-outline/brain" x="594" y="159" width="32" height="32" fill="#E74C3C"/>
      <text x="650" y="175" font-family="Georgia, SimHei, serif" font-size="22" font-weight="bold" fill="#2C3E50">因果幻觉</text>
      <text x="650" y="205" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">Causal Hallucination</text>
      <text x="600" y="245" font-family="Arial, sans-serif" font-size="15" fill="#2C3E50">LLM 生成的因果关系缺乏逻辑一致性，</text>
      <text x="600" y="265" font-family="Arial, sans-serif" font-size="15" fill="#2C3E50">可能包含<tspan fill="#E74C3C" font-weight="bold">无中生有</tspan>的因果链</text>
    </g>
    <!-- Card 2: 环路隐患 -->
    <g id="pain-2" filter="url(#cardShadow)">
      <rect x="560" y="290" width="660" height="140" rx="10" fill="#FFFFFF"/>
      <rect x="560" y="290" width="6" height="140" rx="3" fill="#E8B931"/>
      <circle cx="610" cy="335" r="24" fill="#E8B931" fill-opacity="0.1"/>
      <use data-icon="tabler-outline/refresh" x="594" y="319" width="32" height="32" fill="#E8B931"/>
      <text x="650" y="335" font-family="Georgia, SimHei, serif" font-size="22" font-weight="bold" fill="#2C3E50">环路隐患</text>
      <text x="650" y="365" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">Cycle Hazard</text>
      <text x="600" y="405" font-family="Arial, sans-serif" font-size="15" fill="#2C3E50">有向图中出现 A→B→C→A 循环，</text>
      <text x="600" y="425" font-family="Arial, sans-serif" font-size="15" fill="#2C3E50">违反<tspan fill="#E8B931" font-weight="bold">DAG 基本约束</tspan>，导致推理失效</text>
    </g>
    <!-- Card 3: 风险盲区 -->
    <g id="pain-3" filter="url(#cardShadow)">
      <rect x="560" y="450" width="660" height="140" rx="10" fill="#FFFFFF"/>
      <rect x="560" y="450" width="6" height="140" rx="3" fill="#2E86DE"/>
      <circle cx="610" cy="495" r="24" fill="#2E86DE" fill-opacity="0.1"/>
      <use data-icon="tabler-outline/alert-triangle" x="594" y="479" width="32" height="32" fill="#2E86DE"/>
      <text x="650" y="495" font-family="Georgia, SimHei, serif" font-size="22" font-weight="bold" fill="#2C3E50">风险盲区</text>
      <text x="650" y="525" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">Risk Blind Spot</text>
      <text x="600" y="565" font-family="Arial, sans-serif" font-size="15" fill="#2C3E50">提取出的因果边<tspan fill="#2E86DE" font-weight="bold">无量化风险评估</tspan>，</text>
      <text x="600" y="585" font-family="Arial, sans-serif" font-size="15" fill="#2C3E50">无法区分高危与低危路径</text>
    </g>
  </g>
  <!-- Footer -->
  <g id="p02-footer">
    <text x="60" y="695" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">02</text>
    <text x="1220" y="695" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">EdgeThemis</text>
  </g>
</svg>
