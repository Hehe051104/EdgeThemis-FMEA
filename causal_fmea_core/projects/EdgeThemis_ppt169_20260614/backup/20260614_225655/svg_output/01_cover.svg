<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="navyBand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3C6E"/>
      <stop offset="100%" stop-color="#0F2445"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E86DE"/>
      <stop offset="100%" stop-color="#E8B931"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Navy header band -->
  <rect x="0" y="0" width="1280" height="380" fill="url(#navyBand)"/>
  <!-- Decorative geometric shapes -->
  <rect x="920" y="40" width="320" height="320" rx="4" fill="#FFFFFF" fill-opacity="0.03" transform="rotate(15, 1080, 200)"/>
  <rect x="960" y="80" width="240" height="240" rx="4" fill="#FFFFFF" fill-opacity="0.04" transform="rotate(25, 1080, 200)"/>
  <circle cx="1080" cy="200" r="80" fill="none" stroke="#2E86DE" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="1080" cy="200" r="120" fill="none" stroke="#E8B931" stroke-width="0.8" stroke-opacity="0.1"/>
  <!-- Small decorative dots -->
  <circle cx="950" cy="60" r="3" fill="#2E86DE" fill-opacity="0.4"/>
  <circle cx="1020" cy="90" r="2" fill="#E8B931" fill-opacity="0.3"/>
  <circle cx="1150" cy="120" r="4" fill="#2E86DE" fill-opacity="0.2"/>
  <circle cx="1100" cy="320" r="2.5" fill="#E8B931" fill-opacity="0.35"/>
  <!-- Accent line -->
  <rect x="80" y="380" width="1120" height="4" fill="url(#accentLine)"/>
  <!-- Title group -->
  <g id="cover-title">
    <text x="80" y="160" font-family="Georgia, SimHei, serif" font-size="48" font-weight="bold" fill="#FFFFFF">EdgeThemis</text>
    <text x="80" y="220" font-family="Georgia, SimHei, serif" font-size="28" fill="#FFFFFF" fill-opacity="0.95">基于形式化验证的因果推理引擎</text>
    <text x="80" y="268" font-family="Georgia, SimHei, serif" font-size="20" fill="#FFFFFF" fill-opacity="0.7" font-style="italic">A Causal Reasoning Engine with Formal Verification</text>
  </g>
  <!-- Subtitle keywords -->
  <g id="cover-keywords">
    <rect x="80" y="310" width="120" height="30" rx="15" fill="#2E86DE" fill-opacity="0.25"/>
    <text x="140" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">LLM</text>
    <rect x="215" y="310" width="160" height="30" rx="15" fill="#2E86DE" fill-opacity="0.25"/>
    <text x="295" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">Formal Verification</text>
    <rect x="390" y="310" width="100" height="30" rx="15" fill="#2E86DE" fill-opacity="0.25"/>
    <text x="440" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">FMEA</text>
    <rect x="505" y="310" width="80" height="30" rx="15" fill="#E8B931" fill-opacity="0.25"/>
    <text x="545" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="600">DAG</text>
  </g>
  <!-- Bottom info area -->
  <g id="cover-info">
    <text x="80" y="460" font-family="Arial, sans-serif" font-size="18" fill="#2C3E50" font-weight="600">[Author Name]</text>
    <text x="80" y="490" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">[University / Lab]</text>
    <line x1="80" y1="510" x2="280" y2="510" stroke="#D5D8DC" stroke-width="1"/>
    <text x="80" y="540" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D">2026</text>
  </g>
  <!-- Footer -->
  <g id="cover-footer">
    <text x="1200" y="695" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">EdgeThemis — Causal Reasoning with Formal Verification</text>
  </g>
</svg>
