<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Header -->
  <g id="p06-header">
    <rect x="60" y="30" width="5" height="36" rx="2" fill="#1A3C6E"/>
    <text x="78" y="57" font-family="Georgia, SimHei, serif" font-size="32" font-weight="bold" fill="#1A3C6E">Bayesian Ball 算法详解</text>
    <text x="500" y="57" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">：带方向状态的变种 BFS</text>
    <text x="78" y="78" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D">Direction-Aware BFS for d-Separation · O(V³) Complexity</text>
    <line x1="60" y1="92" x2="1220" y2="92" stroke="#D5D8DC" stroke-width="1"/>
  </g>
  <!-- Core concept: Direction state -->
  <g id="p06-core">
    <text x="60" y="120" font-family="Georgia, SimHei, serif" font-size="20" font-weight="bold" fill="#1A3C6E">核心思想：每个节点携带"运动方向"状态</text>
    <text x="60" y="145" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D">传统 BFS 只记 visited[node]，Bayesian Ball 记 visited[(node, direction)] — 同一节点不同方向可被多次访问</text>
    <!-- State tuple visualization -->
    <g transform="translate(60, 165)">
      <rect x="0" y="0" width="280" height="50" rx="8" fill="#1A3C6E" fill-opacity="0.08"/>
      <text x="140" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#1A3C6E" font-weight="bold">queue: (node, direction)</text>
      <text x="140" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">direction = Up(逆流找原因) / Down(顺流找结果)</text>
    </g>
    <g transform="translate(380, 165)">
      <rect x="0" y="0" width="280" height="50" rx="8" fill="#2E86DE" fill-opacity="0.08"/>
      <text x="140" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#2E86DE" font-weight="bold">visited: HashSet&lt;(node, dir)&gt;</text>
      <text x="140" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">同一节点+同一方向才去重</text>
    </g>
    <g transform="translate(700, 165)">
      <rect x="0" y="0" width="520" height="50" rx="8" fill="#27AE60" fill-opacity="0.08"/>
      <text x="260" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#27AE60" font-weight="bold">if ball reaches Y → return false (NOT d-separated)</text>
      <text x="260" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">球滚到终点 = 存在非法连通路径 = 报错</text>
    </g>
  </g>
  <!-- 4 State Transition Rules -->
  <g id="p06-rules">
    <text x="60" y="248" font-family="Georgia, SimHei, serif" font-size="20" font-weight="bold" fill="#1A3C6E">4 条状态转移规则（算法核心）</text>
    <!-- Rule table -->
    <!-- Header -->
    <rect x="60" y="268" width="1160" height="38" rx="6" fill="#1A3C6E"/>
    <text x="160" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">进入方向</text>
    <text x="360" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">节点 Z 状态</text>
    <text x="540" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">允许 Up?</text>
    <text x="700" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">允许 Down?</text>
    <text x="940" y="293" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF">对应结构 &amp; 物理含义</text>
    <!-- Rule 1: Up + unobserved -->
    <g id="rule-1">
      <rect x="60" y="310" width="1160" height="55" rx="4" fill="#F5F7FA"/>
      <text x="160" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" font-weight="bold">Up（找原因）</text>
      <text x="160" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">逆箭头走</text>
      <rect x="300" y="318" width="120" height="28" rx="14" fill="#27AE60" fill-opacity="0.15"/>
      <text x="360" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#27AE60" font-weight="bold">未观测</text>
      <rect x="490" y="318" width="100" height="28" rx="14" fill="#27AE60" fill-opacity="0.15"/>
      <text x="540" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#27AE60" font-weight="bold">✓ 允许</text>
      <rect x="650" y="318" width="100" height="28" rx="14" fill="#27AE60" fill-opacity="0.15"/>
      <text x="700" y="337" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#27AE60" font-weight="bold">✓ 允许</text>
      <text x="940" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">分叉 X←Z→Y：Z 未锁定，后门大开</text>
      <text x="940" y="353" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">信息可自由通过未观测的混杂变量</text>
    </g>
    <!-- Rule 2: Up + observed -->
    <g id="rule-2">
      <rect x="60" y="370" width="1160" height="55" rx="4" fill="#FFFFFF"/>
      <text x="160" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" font-weight="bold">Up（找原因）</text>
      <text x="160" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">逆箭头走</text>
      <rect x="300" y="378" width="120" height="28" rx="14" fill="#E74C3C" fill-opacity="0.15"/>
      <text x="360" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">已观测</text>
      <rect x="490" y="378" width="100" height="28" rx="14" fill="#E74C3C" fill-opacity="0.15"/>
      <text x="540" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">✗ 阻断</text>
      <rect x="650" y="378" width="100" height="28" rx="14" fill="#E74C3C" fill-opacity="0.15"/>
      <text x="700" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">✗ 阻断</text>
      <text x="940" y="393" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">分叉 X←Z→Y：Z 被锁定，后门关闭</text>
      <text x="940" y="413" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">观测到混杂变量，切断虚假相关性</text>
    </g>
    <!-- Rule 3: Down + unobserved -->
    <g id="rule-3">
      <rect x="60" y="430" width="1160" height="55" rx="4" fill="#F5F7FA"/>
      <text x="160" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" font-weight="bold">Down（找结果）</text>
      <text x="160" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">顺箭头走</text>
      <rect x="300" y="438" width="120" height="28" rx="14" fill="#27AE60" fill-opacity="0.15"/>
      <text x="360" y="457" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#27AE60" font-weight="bold">未观测</text>
      <rect x="490" y="438" width="100" height="28" rx="14" fill="#E74C3C" fill-opacity="0.15"/>
      <text x="540" y="457" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">✗ 阻断</text>
      <rect x="650" y="438" width="100" height="28" rx="14" fill="#27AE60" fill-opacity="0.15"/>
      <text x="700" y="457" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#27AE60" font-weight="bold">✓ 允许</text>
      <text x="940" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">链式 X→Z→Y：Z 未定，因果传导畅通</text>
      <text x="940" y="473" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">唯一正确的合法通路（真实因果链）</text>
    </g>
    <!-- Rule 4: Down + observed -->
    <g id="rule-4">
      <rect x="60" y="490" width="1160" height="55" rx="4" fill="#FFFFFF"/>
      <text x="160" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50" font-weight="bold">Down（找结果）</text>
      <text x="160" y="533" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">顺箭头走</text>
      <rect x="300" y="498" width="120" height="28" rx="14" fill="#E74C3C" fill-opacity="0.15"/>
      <text x="360" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">已观测</text>
      <rect x="490" y="498" width="100" height="28" rx="14" fill="#27AE60" fill-opacity="0.15"/>
      <text x="540" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#27AE60" font-weight="bold">✓ 允许</text>
      <rect x="650" y="498" width="100" height="28" rx="14" fill="#E74C3C" fill-opacity="0.15"/>
      <text x="700" y="517" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">✗ 阻断</text>
      <text x="940" y="513" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">对撞 X→Z←Y：致命陷阱被激活！</text>
      <text x="940" y="533" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">观测对撞节点反而打通虚假路径（explaining away）</text>
    </g>
  </g>
  <!-- Code snippet -->
  <g id="p06-code">
    <rect x="60" y="565" width="600" height="110" rx="8" fill="#1A3C6E" fill-opacity="0.05" stroke="#D5D8DC" stroke-width="1"/>
    <text x="80" y="588" font-family="Consolas, monospace" font-size="13" fill="#7F8C8D">// Rust 核心：方向状态 BFS</text>
    <text x="80" y="610" font-family="Consolas, monospace" font-size="13" fill="#2C3E50">queue.push_back((x, <tspan fill="#2E86DE" font-weight="bold">false</tspan>)); <tspan fill="#7F8C8D">// 从X出发，默认Up</tspan></text>
    <text x="80" y="630" font-family="Consolas, monospace" font-size="13" fill="#2C3E50"><tspan fill="#E74C3C" font-weight="bold">if</tspan> curr == y { <tspan fill="#E74C3C" font-weight="bold">return false</tspan>; } <tspan fill="#7F8C8D">// 球到终点=报错</tspan></text>
    <text x="80" y="650" font-family="Consolas, monospace" font-size="13" fill="#2C3E50"><tspan fill="#27AE60" font-weight="bold">if</tspan> !is_down &amp;&amp; !observed[curr] { <tspan fill="#7F8C8D">// Rule 1/2</tspan></text>
    <text x="80" y="668" font-family="Consolas, monospace" font-size="13" fill="#2C3E50">  explore_children(); explore_parents(); }</text>
  </g>
  <!-- Right side: key insight -->
  <g id="p06-insight" filter="url(#cardShadow)">
    <rect x="690" y="565" width="530" height="110" rx="10" fill="#FFFFFF"/>
    <rect x="690" y="565" width="530" height="6" rx="3" fill="#E8B931"/>
    <text x="710" y="595" font-family="Arial, sans-serif" font-size="15" fill="#E8B931" font-weight="bold">关键理解</text>
    <text x="710" y="620" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">• "允许"≠ 大模型做对了，而是让侦探能探测到漏洞</text>
    <text x="710" y="642" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">• "阻断"= 防火门关死，信息流被物理切断</text>
    <text x="710" y="664" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">• 球到 Y = 发现非法通路 = 生成 FMEA 拦截报告</text>
  </g>
  <g id="p06-footer">
    <text x="60" y="695" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">06</text>
    <text x="1220" y="695" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">EdgeThemis</text>
  </g>
</svg>
