<text x="78" y="56" font-family="Georgia, SimHei, serif" font-size="28" font-weight="bold" fill="#1A3C6E">Generator 节点：LLM 结构化提取</text>
<text x="78" y="76" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D">Structured Causal Graph Extraction via JSON Schema</text>
<line x1="60" y1="88" x2="1220" y2="88" stroke="#D5D8DC" stroke-width="1"/></g>
