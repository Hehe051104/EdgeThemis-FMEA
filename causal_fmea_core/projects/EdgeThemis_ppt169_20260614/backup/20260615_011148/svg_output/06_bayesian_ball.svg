  <!-- Key insight box -->
  <g id="insight" filter="url(#cs)">
    <rect x="60" y="425" width="600" height="95" rx="8" fill="#FFF" stroke="#E8B931" stroke-width="1.5"/>
    <rect x="60" y="425" width="600" height="6" rx="3" fill="#E8B931"/>
    <text x="80" y="455" font-family="Georgia, SimHei, serif" font-size="15" fill="#E8B931" font-weight="bold">关键理解</text>
    <text x="80" y="478" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">• "允许"≠ 大模型做对了，而是让侦探能<tspan font-weight="bold" fill="#E74C3C">探测到漏洞</tspan></text>
    <text x="80" y="498" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">• 球到 Y = 发现通路 → 上层判断是否报警</text>
    <text x="80" y="518" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">• 球卡死 = 路径安全 → 无需干预</text>
  </g>
  <!-- Rust code -->
  <g id="code">
    <rect x="680" y="425" width="540" height="95" rx="8" fill="#1A3C6E" fill-opacity="0.04" stroke="#D5D8DC" stroke-width="1"/>
    <text x="700" y="448" font-family="Consolas, monospace" font-size="12" fill="#7F8C8D">// Rust 核心：方向状态 BFS</text>
    <text x="700" y="468" font-family="Consolas, monospace" font-size="12" fill="#2C3E50">queue.push_back((x, <tspan fill="#2E86DE" font-weight="bold">false</tspan>)); <tspan fill="#7F8C8D">// Up</tspan></text>
    <text x="700" y="486" font-family="Consolas, monospace" font-size="12" fill="#2C3E50"><tspan fill="#E74C3C" font-weight="bold">if</tspan> curr == y { <tspan fill="#E74C3C" font-weight="bold">return false</tspan>; }</text>
    <text x="700" y="504" font-family="Consolas, monospace" font-size="12" fill="#2C3E50"><tspan fill="#27AE60" font-weight="bold">if</tspan> !is_down &amp;&amp; !observed[curr] {</text>
    <text x="712" y="518" font-family="Consolas, monospace" font-size="11" fill="#7F8C8D">explore_children(); explore_parents();</text>
  </g>
