<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.12" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Header -->
  <g id="p07-header">
    <rect x="60" y="40" width="5" height="36" rx="2" fill="#1A3C6E"/>
    <text x="78" y="67" font-family="Georgia, SimHei, serif" font-size="34" font-weight="bold" fill="#1A3C6E">自反思纠错闭环</text>
    <text x="430" y="67" font-family="Arial, sans-serif" font-size="16" fill="#7F8C8D">：LLM 自动修正因果图的迭代流程</text>
    <text x="78" y="90" font-family="Arial, sans-serif" font-size="14" fill="#7F8C8D" letter-spacing="0.5">Self-Reflection Loop: Automated Iterative Correction</text>
    <line x1="60" y1="104" x2="1220" y2="104" stroke="#D5D8DC" stroke-width="1"/>
  </g>
  <!-- Circular flow diagram (left side) -->
  <g id="p07-cycle" transform="translate(0, 10)">
    <!-- Center guide ring -->
    <circle cx="350" cy="380" r="170" fill="none" stroke="#E8E8E8" stroke-width="1.5" stroke-dasharray="6,4"/>
    <circle cx="350" cy="380" r="110" fill="none" stroke="#E8E8E8" stroke-width="1" stroke-dasharray="4,4"/>
    <!-- Center text -->
    <text x="350" y="370" text-anchor="middle" font-family="Georgia, SimHei, serif" font-size="20" font-weight="bold" fill="#1A3C6E">Reflection</text>
    <text x="350" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">最多 5 轮熔断</text>
    <!-- Arc arrows between nodes -->
    <!-- 1→2 -->
    <path d="M 410,230 Q 500,250 510,340" stroke="#2E86DE" stroke-width="2.5" fill="none" stroke-opacity="0.5"/>
    <polygon points="515,342 508,334 512,348" fill="#2E86DE" fill-opacity="0.6"/>
    <!-- 2→3 -->
    <path d="M 510,400 Q 520,490 430,530" stroke="#E74C3C" stroke-width="2.5" fill="none" stroke-opacity="0.5"/>
    <polygon points="428,535 438,528 424,528" fill="#E74C3C" fill-opacity="0.6"/>
    <!-- 3→4 -->
    <path d="M 380,540 Q 300,560 250,500" stroke="#E8B931" stroke-width="2.5" fill="none" stroke-opacity="0.5"/>
    <polygon points="247,496 254,506 240,502" fill="#E8B931" fill-opacity="0.6"/>
    <!-- 4→1 (loop back) -->
    <path d="M 240,430 Q 210,340 280,240" stroke="#27AE60" stroke-width="2.5" fill="none" stroke-opacity="0.5"/>
    <polygon points="283,238 274,246 288,246" fill="#27AE60" fill-opacity="0.6"/>
    <!-- Node 1: Generate -->
    <g id="node-generate">
      <circle cx="350" cy="220" r="48" fill="#2E86DE" filter="url(#nodeShadow)"/>
      <text x="350" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">01</text>
      <text x="350" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.85">Generate</text>
    </g>
    <!-- Node 2: Validate -->
    <g id="node-validate">
      <circle cx="520" cy="370" r="48" fill="#E74C3C" filter="url(#nodeShadow)"/>
      <text x="520" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">02</text>
      <text x="520" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.85">Validate</text>
    </g>
    <!-- Node 3: Intercept -->
    <g id="node-intercept">
      <circle cx="380" cy="530" r="48" fill="#E8B931" filter="url(#nodeShadow)"/>
      <text x="380" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">03</text>
      <text x="380" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.85">Intercept</text>
    </g>
    <!-- Node 4: Retry -->
    <g id="node-retry">
      <circle cx="230" cy="420" r="48" fill="#27AE60" filter="url(#nodeShadow)"/>
      <text x="230" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">04</text>
      <text x="230" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.85">Retry</text>
    </g>
  </g>
  <!-- Right side: 3-round iteration cards -->
  <g id="p07-rounds">
    <!-- Round 1 -->
    <g id="round-1" filter="url(#cardShadow)">
      <rect x="640" y="130" width="580" height="140" rx="10" fill="#FFFFFF"/>
      <rect x="640" y="130" width="6" height="140" rx="3" fill="#E74C3C"/>
      <rect x="660" y="145" width="80" height="28" rx="14" fill="#E74C3C"/>
      <text x="700" y="164" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">Round 1</text>
      <text x="760" y="164" font-family="Arial, sans-serif" font-size="15" fill="#2C3E50" font-weight="bold">LLM 提取 → Rust 检测到环路</text>
      <text x="660" y="195" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
        <tspan x="660" dy="0">提取结果：A→B→C→A（含循环）</tspan>
      </text>
      <text x="660" y="220" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
        <tspan x="660" dy="0">Rust Kahn 检测：发现<tspan fill="#E74C3C" font-weight="bold">环路</tspan>，违反 DAG 约束</tspan>
      </text>
      <text x="660" y="248" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">→ 拦截报告反馈 LLM 生成器</text>
    </g>
    <!-- Round 2 -->
    <g id="round-2" filter="url(#cardShadow)">
      <rect x="640" y="290" width="580" height="140" rx="10" fill="#FFFFFF"/>
      <rect x="640" y="290" width="6" height="140" rx="3" fill="#E8B931"/>
      <rect x="660" y="305" width="80" height="28" rx="14" fill="#E8B931"/>
      <text x="700" y="324" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">Round 2</text>
      <text x="760" y="324" font-family="Arial, sans-serif" font-size="15" fill="#2C3E50" font-weight="bold">LLM 修正 → 环路消除，但 d-分离违反</text>
      <text x="660" y="355" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
        <tspan x="660" dy="0">环路已消除，DAG 合法性通过</tspan>
      </text>
      <text x="660" y="380" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
        <tspan x="660" dy="0">Bayesian Ball 检测：X 和 Y 应<tspan fill="#E8B931" font-weight="bold">条件独立</tspan>但存在活跃路径</tspan>
      </text>
      <text x="660" y="408" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">→ 拦截报告再次反馈 LLM</text>
    </g>
    <!-- Round 3 -->
    <g id="round-3" filter="url(#cardShadow)">
      <rect x="640" y="450" width="580" height="140" rx="10" fill="#FFFFFF"/>
      <rect x="640" y="450" width="6" height="140" rx="3" fill="#27AE60"/>
      <rect x="660" y="465" width="80" height="28" rx="14" fill="#27AE60"/>
      <text x="700" y="484" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#FFFFFF" font-weight="bold">Round 3</text>
      <text x="760" y="484" font-family="Arial, sans-serif" font-size="15" fill="#2C3E50" font-weight="bold">LLM 再次修正 → 全部验证通过</text>
      <text x="660" y="515" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
        <tspan x="660" dy="0">DAG 合法性：<tspan fill="#27AE60" font-weight="bold">✓ 无环路</tspan></tspan>
      </text>
      <text x="660" y="540" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
        <tspan x="660" dy="0">d-分离一致性：<tspan fill="#27AE60" font-weight="bold">✓ 条件独立关系正确</tspan></tspan>
      </text>
      <text x="660" y="568" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">
        <tspan x="660" dy="0">FMEA RPN：<tspan fill="#27AE60" font-weight="bold">✓ 风险标注完成</tspan></tspan>
      </text>
    </g>
  </g>
  <!-- Fuse mechanism note -->
  <g id="p07-fuse">
    <rect x="60" y="630" width="500" height="40" rx="8" fill="#1A3C6E" fill-opacity="0.08"/>
    <use data-icon="tabler-outline/shield-check" x="75" y="638" width="24" height="24" fill="#1A3C6E"/>
    <text x="110" y="655" font-family="Arial, sans-serif" font-size="14" fill="#1A3C6E" font-weight="bold">熔断机制：最多 5 轮，防止无限循环</text>
  </g>
  <!-- Footer -->
  <g id="p07-footer">
    <text x="60" y="695" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">09</text>
    <text x="1220" y="695" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">EdgeThemis</text>
  </g>
</svg>
