<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.06" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetblur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <!-- Header -->
  <g id="p06-header">
    <rect x="60" y="25" width="5" height="32" rx="2" fill="#1A3C6E"/>
    <text x="78" y="52" font-family="Georgia, SimHei, serif" font-size="30" font-weight="bold" fill="#1A3C6E">Bayesian Ball 算法详解</text>
    <text x="460" y="52" font-family="Arial, sans-serif" font-size="15" fill="#7F8C8D">：带方向状态的变种 BFS · 球滚到 Y = 报警</text>
    <line x1="60" y1="66" x2="1220" y2="66" stroke="#D5D8DC" stroke-width="1"/>
  </g>
  <!-- Core: state tuple -->
  <g id="p06-core">
    <rect x="60" y="78" width="380" height="36" rx="6" fill="#1A3C6E" fill-opacity="0.06"/>
    <text x="250" y="101" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#1A3C6E" font-weight="bold">状态 = (node, direction) · direction: Up=逆箭头 / Down=顺箭头</text>
  </g>
  <!-- LEFT: Rule 1 example — Fork, unobserved -->
  <g id="p06-rule1">
    <rect x="60" y="125" width="570" height="280" rx="10" fill="#FFFFFF" stroke="#E74C3C" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="60" y="125" width="570" height="6" rx="3" fill="#E74C3C"/>
    <!-- Title -->
    <rect x="80" y="145" width="280" height="24" rx="12" fill="#E74C3C" fill-opacity="0.12"/>
    <text x="220" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">规则 1: Up + 未观测 → 允许</text>
    <!-- DAG -->
    <g transform="translate(130, 210)">
      <!-- M node (unobserved - dashed) -->
      <circle cx="80" cy="-30" r="22" fill="none" stroke="#E74C3C" stroke-width="2" stroke-dasharray="4,3"/>
      <text x="80" y="-24" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">M</text>
      <text x="80" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">暴雨(未记录)</text>
      <!-- X node -->
      <circle cx="0" cy="30" r="22" fill="#E74C3C" fill-opacity="0.1" stroke="#E74C3C" stroke-width="2"/>
      <text x="0" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">X</text>
      <text x="0" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">手术推迟</text>
      <!-- Y node -->
      <circle cx="160" cy="30" r="22" fill="none" stroke="#E74C3C" stroke-width="2"/>
      <text x="160" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#E74C3C" font-weight="bold">Y</text>
      <text x="160" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">空气湿度高</text>
      <!-- Edges -->
      <line x1="20" y1="18" x2="60" y2="-18" stroke="#E74C3C" stroke-width="2"/>
      <polygon points="20,18 28,14 24,22" fill="#E74C3C"/>
      <line x1="100" y1="-18" x2="140" y2="18" stroke="#E74C3C" stroke-width="2"/>
      <polygon points="140,18 132,14 136,22" fill="#E74C3C"/>
    </g>
    <!-- Ball trace -->
    <g transform="translate(350, 145)">
      <text x="0" y="16" font-family="Consolas, monospace" font-size="12" fill="#E74C3C" font-weight="bold">球的移动轨迹：</text>
      <text x="0" y="36" font-family="Consolas, monospace" font-size="11" fill="#2C3E50">Step0: (X, Up) 出发</text>
      <text x="0" y="54" font-family="Consolas, monospace" font-size="11" fill="#2C3E50">Step1: X未观测 → Rule1</text>
      <text x="12" y="70" font-family="Consolas, monospace" font-size="11" fill="#27AE60">→ Up到M: (M, Up)</text>
      <text x="0" y="90" font-family="Consolas, monospace" font-size="11" fill="#2C3E50">Step2: M未观测 → Rule1</text>
      <text x="12" y="106" font-family="Consolas, monospace" font-size="11" fill="#27AE60">→ Down到Y: (Y, Down)</text>
      <text x="0" y="130" font-family="Consolas, monospace" font-size="13" fill="#E74C3C" font-weight="bold">球到Y! → return false</text>
      <text x="0" y="150" font-family="Arial, sans-serif" font-size="12" fill="#E74C3C">X和Y未被d-分离 → 报警!</text>
    </g>
    <!-- Bottom explanation -->
    <text x="80" y="378" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">暴雨(M)未被记录 → 后门大开 → LLM 可能产生"手术推迟导致湿度高"的虚假因果</text>
    <text x="80" y="398" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">Fork X←M→Y：M 未观测时，信息通过 M 自由传递，X 和 Y 产生虚假相关性</text>
  </g>
  <!-- RIGHT: Rule 2 example — Fork, observed -->
  <g id="p06-rule2">
    <rect x="650" y="125" width="570" height="280" rx="10" fill="#FFFFFF" stroke="#27AE60" stroke-width="1.5" filter="url(#cardShadow)"/>
    <rect x="650" y="125" width="570" height="6" rx="3" fill="#27AE60"/>
    <rect x="670" y="145" width="280" height="24" rx="12" fill="#27AE60" fill-opacity="0.12"/>
    <text x="810" y="162" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#27AE60" font-weight="bold">规则 2: Up + 已观测 → 阻断</text>
    <!-- DAG -->
    <g transform="translate(720, 210)">
      <!-- M node (observed - solid fill) -->
      <circle cx="80" cy="-30" r="22" fill="#27AE60" fill-opacity="0.2" stroke="#27AE60" stroke-width="2"/>
      <text x="80" y="-24" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#27AE60" font-weight="bold">M</text>
      <text x="80" y="-5" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#27AE60" font-weight="bold">暴雨(已确认)✓</text>
      <!-- X node -->
      <circle cx="0" cy="30" r="22" fill="#27AE60" fill-opacity="0.1" stroke="#27AE60" stroke-width="2"/>
      <text x="0" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#27AE60" font-weight="bold">X</text>
      <text x="0" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">手术推迟</text>
      <!-- Y node -->
      <circle cx="160" cy="30" r="22" fill="none" stroke="#27AE60" stroke-width="2"/>
      <text x="160" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#27AE60" font-weight="bold">Y</text>
      <text x="160" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7F8C8D">空气湿度高</text>
      <!-- Edges -->
      <line x1="20" y1="18" x2="60" y2="-18" stroke="#27AE60" stroke-width="2"/>
      <polygon points="20,18 28,14 24,22" fill="#27AE60"/>
      <line x1="100" y1="-18" x2="140" y2="18" stroke="#27AE60" stroke-width="2"/>
      <polygon points="140,18 132,14 136,22" fill="#27AE60"/>
      <!-- Block symbol -->
      <text x="80" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#E74C3C">✕</text>
    </g>
    <!-- Ball trace -->
    <g transform="translate(940, 145)">
      <text x="0" y="16" font-family="Consolas, monospace" font-size="12" fill="#27AE60" font-weight="bold">球的移动轨迹：</text>
      <text x="0" y="36" font-family="Consolas, monospace" font-size="11" fill="#2C3E50">Step0: (X, Up) 出发</text>
      <text x="0" y="54" font-family="Consolas, monospace" font-size="11" fill="#2C3E50">Step1: X未观测 → Rule1</text>
      <text x="12" y="70" font-family="Consolas, monospace" font-size="11" fill="#27AE60">→ Up到M: (M, Up)</text>
      <text x="0" y="90" font-family="Consolas, monospace" font-size="11" fill="#2C3E50">Step2: M已观测 → Rule2</text>
      <text x="12" y="106" font-family="Consolas, monospace" font-size="11" fill="#E74C3C">→ 两个方向都阻断!</text>
      <text x="12" y="122" font-family="Consolas, monospace" font-size="11" fill="#E74C3C">→ 球卡死在M</text>
      <text x="0" y="146" font-family="Consolas, monospace" font-size="13" fill="#27AE60" font-weight="bold">球到不了Y → return true</text>
      <text x="0" y="166" font-family="Arial, sans-serif" font-size="12" fill="#27AE60">X和Y被d-分离 → 安全!</text>
    </g>
    <!-- Bottom explanation -->
    <text x="670" y="378" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">暴雨(M)已被确认为事实 → 后门关闭 → 在"已知暴雨"前提下，X和Y无虚假相关</text>
    <text x="670" y="398" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">观测到混杂变量后，虚假相关性被物理切断，LLM 无法再利用这条路径产生幻觉</text>
  </g>
  <!-- Bottom: Key insight -->
  <g id="p06-insight" filter="url(#cardShadow)">
    <rect x="60" y="420" width="1160" height="55" rx="8" fill="#1A3C6E" fill-opacity="0.04"/>
    <text x="80" y="445" font-family="Georgia, SimHei, serif" font-size="16" font-weight="bold" fill="#1A3C6E">核心理解：</text>
    <text x="220" y="445" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">同一种结构（Fork），M 的观测状态决定了路径是</text>
    <text x="700" y="445" font-family="Arial, sans-serif" font-size="14" fill="#E74C3C" font-weight="bold">连通</text>
    <text x="740" y="445" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">还是</text>
    <text x="770" y="445" font-family="Arial, sans-serif" font-size="14" fill="#27AE60" font-weight="bold">阻断</text>
    <text x="810" y="445" font-family="Arial, sans-serif" font-size="14" fill="#2C3E50">。球的移动方向（Up/Down）决定了它走哪条规则。</text>
    <text x="80" y="468" font-family="Arial, sans-serif" font-size="13" fill="#7F8C8D">LLM 的错误不在于画了 Fork 结构（结构本身无罪），而在于对 M 的 is_observed 状态判断错误，导致不该通的路径"漏水"了。</text>
  </g>
  <!-- Right half: Rules 3&4 preview + code -->
  <g id="p06-code">
    <rect x="60" y="490" width="560" height="190" rx="8" fill="#1A3C6E" fill-opacity="0.04" stroke="#D5D8DC" stroke-width="1"/>
    <text x="80" y="515" font-family="Consolas, monospace" font-size="13" fill="#7F8C8D">// Rust 核心：方向状态 BFS</text>
    <text x="80" y="537" font-family="Consolas, monospace" font-size="13" fill="#2C3E50">queue.push_back((x, <tspan fill="#2E86DE" font-weight="bold">false</tspan>)); <tspan fill="#7F8C8D">// 从X出发，Up</tspan></text>
    <text x="80" y="557" font-family="Consolas, monospace" font-size="13" fill="#2C3E50"><tspan fill="#E74C3C" font-weight="bold">if</tspan> curr == y { <tspan fill="#E74C3C" font-weight="bold">return false</tspan>; } <tspan fill="#7F8C8D">// 球到Y=报警</tspan></text>
    <text x="80" y="577" font-family="Consolas, monospace" font-size="13" fill="#2C3E50"><tspan fill="#27AE60" font-weight="bold">if</tspan> !is_down &amp;&amp; !observed[curr] { <tspan fill="#7F8C8D">// Rule1</tspan></text>
    <text x="80" y="595" font-family="Consolas, monospace" font-size="13" fill="#2C3E50">  explore_children(); <tspan fill="#7F8C8D">// Down</tspan></text>
    <text x="80" y="613" font-family="Consolas, monospace" font-size="13" fill="#2C3E50">  explore_parents(); <tspan fill="#7F8C8D">// Up</tspan></text>
    <text x="80" y="633" font-family="Consolas, monospace" font-size="13" fill="#2C3E50">} <tspan fill="#E74C3C" font-weight="bold">else if</tspan> is_down &amp;&amp; observed[curr] { <tspan fill="#7F8C8D">// Rule4</tspan></text>
    <text x="80" y="653" font-family="Consolas, monospace" font-size="13" fill="#2C3E50">  explore_parents(); <tspan fill="#7F8C8D">// Up only — 对撞激活!</tspan></text>
    <text x="80" y="670" font-family="Consolas, monospace" font-size="13" fill="#2C3E50">}</text>
  </g>
  <!-- Summary box -->
  <g id="p06-summary" filter="url(#cardShadow)">
    <rect x="640" y="490" width="580" height="190" rx="10" fill="#FFFFFF"/>
    <rect x="640" y="490" width="580" height="6" rx="3" fill="#E8B931"/>
    <text x="660" y="520" font-family="Arial, sans-serif" font-size="15" fill="#E8B931" font-weight="bold">4 条规则速查</text>
    <text x="660" y="545" font-family="Consolas, monospace" font-size="13" fill="#2C3E50">Rule1: Up+未观测 → <tspan fill="#27AE60" font-weight="bold">Up+Down都允许</tspan> (Fork后门大开)</text>
    <text x="660" y="567" font-family="Consolas, monospace" font-size="13" fill="#2C3E50">Rule2: Up+已观测 → <tspan fill="#E74C3C" font-weight="bold">Up+Down都阻断</tspan> (Fork后门关闭)</text>
    <text x="660" y="589" font-family="Consolas, monospace" font-size="13" fill="#2C3E50">Rule3: Down+未观测 → <tspan fill="#27AE60" font-weight="bold">只允许Down</tspan> (Chain合法通路)</text>
    <text x="660" y="611" font-family="Consolas, monospace" font-size="13" fill="#2C3E50">Rule4: Down+已观测 → <tspan fill="#E74C3C" font-weight="bold">只允许Up</tspan> (Collider陷阱激活!)</text>
    <line x1="660" y1="625" x2="1200" y2="625" stroke="#D5D8DC" stroke-width="1"/>
    <text x="660" y="648" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">球到 Y = 发现通路 → 上层判断是否报警</text>
    <text x="660" y="668" font-family="Arial, sans-serif" font-size="13" fill="#2C3E50">球卡死 = 路径安全 → 无需干预</text>
  </g>
  <g id="p06-footer">
    <text x="60" y="695" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">06</text>
    <text x="1220" y="695" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#7F8C8D">EdgeThemis</text>
  </g>
</svg>
